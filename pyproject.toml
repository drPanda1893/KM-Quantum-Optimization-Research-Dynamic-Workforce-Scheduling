[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "km-quantum"
version = "0.1.0"
description = "Reproducible classical workforce scheduling research baseline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "ortools>=9.14,<10",
    "pydantic>=2.11,<3",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-ibm-runtime==0.47.0",
    "scipy>=1.16,<2",
    "threadpoolctl==3.7.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[project.scripts]
km-quantum = "km_quantum.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/km_quantum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/km_quantum"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ortools.*", "qiskit.*", "qiskit_aer.*", "scipy.*", "matplotlib.*", "psutil.*", "threadpoolctl.*"]
ignore_missing_imports = true
